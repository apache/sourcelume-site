<!-- page contents -->
<div id="contents">
  <div class="bg-white rounded">
    <div class="mx-auto">
      {% if article %}
      <h1>{{ article.title }}</h1>
      <p class="sourcelume-meta">Posted on {{ article.date }}</p>
      {{ article.content }}
      {% else %}
      <h1>{{ page.title }}</h1>
      {{ page.content }}
      {% endif %}
      {% if (article or (page and page.slug != '404')) and SITEREPOSITORY %}
      <p class="sourcelume-edit-page">
        <a href="{{ SITEREPOSITORY }}{% if article %}blog/{{ article.slug }}.md{% else %}pages/{{ page.path_no_ext | default(page.slug) }}.md{% endif %}">Edit this page on GitHub</a>
      </p>
      {% endif %}
    </div>
  </div>
</div>
