    <script src="js/theme.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
      function decodeHtmlEntities(str) {
        const txt = document.createElement("textarea");
        txt.innerHTML = str;
        return txt.value;
      }
      document.querySelectorAll("pre > code.language-mermaid").forEach((code) => {
        let decoded = decodeHtmlEntities(code.innerHTML);
        // Normalize whitespace
        decoded = decoded.replace(/\t/g, "    ");
        decoded = decoded.replace(/^\s*\n/, "").replace(/\n\s*$/, "");
        const div = document.createElement("div");
        div.className = "mermaid";
        div.dataset.mermaidSrc = decoded;
        div.textContent = decoded;
        code.parentElement.replaceWith(div);
      });
      if (typeof window.sourcelumeRenderMermaid === "function") {
        window.sourcelumeRenderMermaid();
      } else {
        mermaid.run({ querySelector: ".mermaid" })
          .catch(err => {
            console.error("Mermaid rendering failed:", err);
          });
      }
      });
    </script>
    <script src="js/copy-code.js"></script>
