{% block head %}
<!doctype html>
<html class="no-js" lang="en" dir="ltr">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} - {{SITENAME}}</title>
    {% if page and page.slug == '404' %}
    <base href="/">
    {% endif %}
    {% include "styles.html" %}
  </head>
  <body class="d-flex flex-column h-100">
    <a class="skip-link" href="#contents">Skip to main content</a>
    {% include "menu.html" %}
    <main class="flex-shrink-0"{% if page and page.slug == '404' %} data-pagefind-ignore{% endif %}>
      <div>
        {% include "generic.html" %}
      </div>
    </main>
    {% include "footer.html" %}
    {% include "post.html" %}
  </body>
</html>
{% endblock %}
